<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คำนวณค่าใช้จ่ายต่อเดือน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f14; --card: #1e1e2a; --border: #2a2a3a;
    --accent: #7c6af7; --accent2: #f7c06a;
    --green: #5ce69c; --red: #f76a6a;
    --text: #e8e8f0; --muted: #7878a0; --input-bg: #12121a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Sarabun', sans-serif; min-height: 100vh; padding: 32px 16px 80px; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px; opacity: 0.18; pointer-events: none; z-index: 0;
  }
  .page { display: none; }
  .page.active { display: block; }
  .container { max-width: 680px; margin: 0 auto; position: relative; z-index: 1; }

  /* ── HOME ── */
  .home-header { text-align: center; margin-bottom: 36px; }
  .home-header h1 {
    font-size: 2rem; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 6px;
  }
  .home-header p { color: var(--muted); font-size: 0.9rem; }
  .profile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .profile-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px; cursor: pointer; transition: border-color 0.2s, transform 0.15s; position: relative;
  }
  .profile-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .profile-card .p-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
  .profile-card .p-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; }
  .profile-card .p-remain { font-family: 'IBM Plex Mono', monospace; font-size: 1.05rem; font-weight: 600; }
  .profile-card .p-remain.pos { color: var(--green); }
  .profile-card .p-remain.neg { color: var(--red); }
  .profile-card .p-delete { position: absolute; top: 10px; right: 12px; background: none; border: none; color: var(--muted); font-size: 1rem; cursor: pointer; transition: color 0.2s; }
  .profile-card .p-delete:hover { color: var(--red); }
  .btn-add {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: linear-gradient(135deg, #1e1e3a, #1e2a1e); border: 2px dashed var(--accent);
    border-radius: 16px; padding: 20px; cursor: pointer; color: var(--accent);
    font-family: 'Sarabun', sans-serif; font-size: 1rem; font-weight: 600; transition: background 0.2s, transform 0.15s;
  }
  .btn-add:hover { background: #1e1e3a; transform: translateY(-2px); }
  .btn-add .plus { font-size: 1.6rem; line-height: 1; }

  /* ── DETAIL ── */
  .detail-header { display: flex; align-items: center; gap: 14px; margin-bottom: 32px; }
  .btn-back { background: var(--card); border: 1px solid var(--border); border-radius: 10px; color: var(--muted); font-family: 'Sarabun', sans-serif; font-size: 0.9rem; padding: 8px 16px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .btn-back:hover { border-color: var(--accent); color: var(--accent); }
  .detail-header h2 { font-size: 1.4rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  .name-card { background: linear-gradient(135deg, #1e1e3a 0%, #2a1e1e 100%); border: 1px solid var(--accent2); border-radius: 16px; padding: 20px; margin-bottom: 24px; }
  .name-card label { font-size: 1rem; font-weight: 600; color: var(--accent2); margin-bottom: 10px; display: block; }
  .name-card input[type="text"] { width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: 'Sarabun', sans-serif; font-size: 1.1rem; padding: 12px 16px; outline: none; transition: border-color 0.2s; }
  .name-card input[type="text"]:focus { border-color: var(--accent2); }

  .salary-card { background: linear-gradient(135deg, #1e1e3a 0%, #1e2a1e 100%); border: 1px solid var(--accent); border-radius: 16px; padding: 24px; margin-bottom: 24px; }
  .salary-card label { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; font-weight: 600; color: var(--accent2); margin-bottom: 12px; }
  .salary-input-wrap { display: flex; align-items: center; background: var(--input-bg); border: 1px solid var(--accent); border-radius: 10px; overflow: hidden; }
  .salary-input-wrap > span { padding: 0 14px; color: var(--accent); font-family: 'IBM Plex Mono', monospace; font-size: 1rem; border-right: 1px solid var(--border); }
  .salary-input-wrap input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 1.2rem; padding: 14px; text-align: right; }

  /* ── CATEGORY BLOCK ── */
  .category-block { margin-bottom: 16px; }
  .category-header {
    display: flex; align-items: center; gap: 8px;
    margin: 24px 0 10px; padding-left: 4px;
  }
  .cat-name-input {
    background: transparent; border: none; border-bottom: 1px dashed var(--muted);
    color: var(--muted); font-family: 'Sarabun', sans-serif;
    font-size: 0.72rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    outline: none; width: 180px; padding: 2px 4px; transition: border-color 0.2s, color 0.2s;
    cursor: text;
  }
  .cat-name-input:focus { border-bottom-color: var(--accent); color: var(--text); }
  .cat-divider { flex: 1; height: 1px; background: var(--border); }
  .btn-del-cat {
    background: none; border: 1px solid transparent; border-radius: 6px;
    color: var(--muted); font-size: 0.78rem; cursor: pointer; padding: 3px 8px;
    font-family: 'Sarabun', sans-serif; transition: all 0.2s; white-space: nowrap;
  }
  .btn-del-cat:hover { color: var(--red); border-color: var(--red); background: rgba(247,106,106,0.08); }

  .expense-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 8px; }

  /* Dynamic rows */
  .dyn-row {
    display: grid; grid-template-columns: 1fr auto; align-items: center;
    padding: 6px 10px 6px 14px; gap: 8px; border-bottom: 1px solid var(--border); transition: background 0.15s;
  }
  .dyn-row:last-child { border-bottom: none; }
  .dyn-row:hover { background: #22222e; }
  .dyn-row-inner { display: flex; flex-direction: column; gap: 4px; padding: 4px 0; }
  .dyn-label-input {
    background: transparent; border: none; border-bottom: 1px dashed var(--border);
    color: var(--text); font-family: 'Sarabun', sans-serif; font-size: 0.92rem;
    outline: none; width: 100%; padding: 2px 0; transition: border-color 0.2s;
  }
  .dyn-label-input:focus { border-bottom-color: var(--accent); }
  .dyn-label-input::placeholder { color: var(--muted); font-style: italic; }
  .row-input-wrap { display: flex; align-items: center; gap: 6px; }
  .row-input-wrap span { font-size: 0.8rem; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }

  /* Number inputs */
  .num-input {
    background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 0.9rem;
    padding: 7px 10px; text-align: right; width: 120px; outline: none; transition: border-color 0.2s;
  }
  .num-input:focus { border-color: var(--accent); }

  /* Delete row btn */
  .btn-del-row { background: none; border: none; color: var(--muted); font-size: 1rem; cursor: pointer; padding: 4px 6px; border-radius: 6px; transition: color 0.2s, background 0.2s; line-height: 1; }
  .btn-del-row:hover { color: var(--red); background: rgba(247,106,106,0.1); }

  /* Add row btn */
  .btn-add-row {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 10px; border: none; background: transparent;
    border-top: 1px dashed var(--border); color: var(--accent);
    font-family: 'Sarabun', sans-serif; font-size: 0.85rem; font-weight: 600;
    cursor: pointer; transition: background 0.2s; border-radius: 0 0 14px 14px;
  }
  .btn-add-row:hover { background: rgba(124,106,247,0.08); }

  /* Add Category btn */
  .btn-add-cat {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 14px; border: 2px dashed var(--border);
    background: transparent; border-radius: 12px; color: var(--accent2);
    font-family: 'Sarabun', sans-serif; font-size: 0.9rem; font-weight: 600;
    cursor: pointer; transition: all 0.2s; margin-top: 12px;
  }
  .btn-add-cat:hover { border-color: var(--accent2); background: rgba(247,192,106,0.06); }

  /* Summary */
  .summary { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-top: 28px; }
  .summary-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
  .summary-row:last-child { border-bottom: none; }
  .summary-row .val { font-family: 'IBM Plex Mono', monospace; font-size: 0.95rem; }
  .summary-row.highlight { padding: 14px 0 0; margin-top: 8px; border-top: 2px solid var(--accent); border-bottom: none; }
  .summary-row.highlight .label { font-weight: 700; font-size: 1rem; color: var(--accent2); }
  .summary-row.highlight .val { font-size: 1.3rem; font-weight: 700; }
  .val.deduct { color: var(--red); }
  .val.remain { color: var(--green); }

  /* Banner */
  .result-banner { margin-top: 24px; border-radius: 16px; padding: 24px; text-align: center; transition: all 0.3s; }
  .result-banner.positive { background: linear-gradient(135deg, #0e2a1a, #1a3a2a); border: 1px solid var(--green); }
  .result-banner.negative { background: linear-gradient(135deg, #2a0e0e, #3a1a1a); border: 1px solid var(--red); }
  .result-banner .banner-label { font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .result-banner .banner-amount { font-family: 'IBM Plex Mono', monospace; font-size: 2.4rem; font-weight: 700; line-height: 1.1; }
  .result-banner.positive .banner-amount { color: var(--green); }
  .result-banner.negative .banner-amount { color: var(--red); }
  .result-banner .banner-note { font-size: 0.85rem; color: var(--muted); margin-top: 6px; }

  /* Buttons */
  .btn-row { display: flex; gap: 12px; margin-top: 24px; }
  .btn-save { flex: 1; background: linear-gradient(135deg, var(--accent), #5a4fcc); border: none; border-radius: 10px; color: #fff; font-family: 'Sarabun', sans-serif; font-size: 1rem; font-weight: 600; padding: 14px; cursor: pointer; transition: opacity 0.2s; }
  .btn-save:hover { opacity: 0.85; }
  .btn-reset { background: transparent; border: 1px solid var(--border); border-radius: 10px; color: var(--muted); font-family: 'Sarabun', sans-serif; font-size: 0.9rem; padding: 10px 22px; cursor: pointer; transition: all 0.2s; }
  .btn-reset:hover { border-color: var(--accent); color: var(--accent); }

  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--accent2); border-radius: 20px; padding: 32px; width: 90%; max-width: 360px; text-align: center; }
  .modal h3 { font-size: 1.2rem; font-weight: 700; color: var(--accent2); margin-bottom: 8px; }
  .modal p { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .modal input[type="text"] { width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: 'Sarabun', sans-serif; font-size: 1.1rem; padding: 12px 16px; outline: none; transition: border-color 0.2s; margin-bottom: 16px; }
  .modal input[type="text"]:focus { border-color: var(--accent2); }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns button { flex: 1; padding: 12px; border-radius: 10px; font-family: 'Sarabun', sans-serif; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
  .btn-confirm { background: linear-gradient(135deg, var(--accent), #5a4fcc); border: none; color: #fff; }
  .btn-confirm:hover { opacity: 0.85; }
  .btn-cancel { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .btn-cancel:hover { border-color: var(--red); color: var(--red); }

  /* Toast */
  .toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--green); color: #0a2a18; font-weight: 700; padding: 12px 28px; border-radius: 50px; font-size: 0.95rem; opacity: 0; transition: all 0.3s; z-index: 200; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Category modal */
  .modal.cat-modal { border-color: var(--accent); }
  .modal.cat-modal h3 { color: var(--accent); }
  .modal.cat-modal input[type="text"]:focus { border-color: var(--accent); }
  .modal.cat-modal .btn-confirm { background: linear-gradient(135deg, var(--accent2), #e0a040); color: #1a1200; }

  /* Sync */
  .sync-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; margin-bottom: 24px; }
  .sync-title { font-weight: 700; color: var(--accent2); margin-bottom: 2px; }
  .sync-desc { font-size: 0.8rem; color: var(--muted); }
  .sync-status, .save-status { font-size: 0.8rem; color: var(--muted); }
  .sync-status { margin-top: 8px; min-height: 1em; }
  .save-status { margin-left: auto; white-space: nowrap; }
  .sync-status.ok, .save-status.ok { color: var(--green); }
  .sync-status.err, .save-status.err { color: var(--red); }
</style>
</head>
<body>

<!-- ══ HOME ══ -->
<div id="page-home" class="page active">
  <div class="container">
    <div class="home-header">
      <h1>💰 ค่าใช้จ่ายต่อเดือน</h1>
      <p>เลือกโปรไฟล์หรือเพิ่มใหม่</p>
    </div>
    <div class="sync-card">
      <div class="sync-title">☁️ ซิงก์ข้ามเครื่อง</div>
      <div class="sync-desc" id="sync-desc"></div>
      <div class="sync-status" id="sync-status"></div>
    </div>
    <div class="profile-grid" id="profile-grid"></div>
  </div>
</div>

<!-- ══ DETAIL ══ -->
<div id="page-detail" class="page">
  <div class="container">
    <div class="detail-header">
      <button class="btn-back" onclick="goHome()">← กลับ</button>
      <h2 id="detail-title">โปรไฟล์</h2>
      <span class="save-status" id="save-status"></span>
    </div>

    <!-- ชื่อ -->
    <div class="name-card">
      <label>👤 ชื่อเจ้าของโปรไฟล์</label>
      <input type="text" id="profile-name" placeholder="เช่น เรา, พี่แนท, สมชาย..." oninput="onNameInput()">
    </div>

    <!-- เงินเดือน -->
    <div class="salary-card">
      <label>💼 เงินเดือน</label>
      <div class="salary-input-wrap">
        <span>฿</span>
        <input class="num-input" id="salary" type="text" inputmode="decimal" value="0" style="width:auto;flex:1;background:transparent;border:none;font-size:1.2rem;padding:14px;">
      </div>
    </div>

    <!-- Categories container -->
    <div id="categories-container"></div>

    <!-- Add Category Button -->
    <button class="btn-add-cat" onclick="openCatModal()">＋ เพิ่มหมวดหมู่ใหม่</button>

    <!-- Summary -->
    <div class="summary" id="summary-section">
      <div class="summary-row">
        <span class="label">เงินเดือน</span>
        <span class="val" id="s_salary">฿0.00</span>
      </div>
      <div id="summary-cats"></div>
      <div class="summary-row highlight">
        <span class="label">💵 เงินคงเหลือสุทธิ</span>
        <span class="val remain" id="s_remain">฿0.00</span>
      </div>
    </div>

    <div class="result-banner positive" id="banner">
      <div class="banner-label">เงินที่เหลือสุทธิต่อเดือน</div>
      <div class="banner-amount" id="banner_amount">฿0.00</div>
      <div class="banner-note" id="banner_note">—</div>
    </div>

    <div class="btn-row">
      <button class="btn-save" onclick="saveProfile()">💾 บันทึก</button>
      <button class="btn-reset" onclick="resetForm()">↺ ล้างค่า</button>
    </div>
  </div>
</div>

<!-- MODAL: New Profile -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>➕ เพิ่มโปรไฟล์ใหม่</h3>
    <p>ตั้งชื่อเจ้าของโปรไฟล์นี้</p>
    <input type="text" id="modal-name" placeholder="เช่น เรา, พี่แนท..." maxlength="30">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
      <button class="btn-confirm" onclick="confirmNew()">สร้าง →</button>
    </div>
  </div>
</div>

<!-- MODAL: New Category -->
<div class="modal-overlay" id="cat-modal">
  <div class="modal cat-modal">
    <h3>📁 เพิ่มหมวดหมู่ใหม่</h3>
    <p>ตั้งชื่อหมวดหมู่ค่าใช้จ่าย</p>
    <input type="text" id="cat-modal-name" placeholder="เช่น ค่าใช้จ่ายสุขภาพ, ท่องเที่ยว..." maxlength="40">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeCatModal()">ยกเลิก</button>
      <button class="btn-confirm" onclick="confirmNewCat()">เพิ่ม →</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const fmt = n => '฿' + n.toLocaleString('th-TH', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtNeg = n => '-฿' + Math.abs(n).toLocaleString('th-TH', {minimumFractionDigits:2, maximumFractionDigits:2});

const STORE_KEY = 'expense_profiles_v2';
const SYNCED_FLAG = 'expense_synced_once';
const AUTOSAVE_MS = 3000;

let profiles = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
let currentId = null;
function saveLocal() { localStorage.setItem(STORE_KEY, JSON.stringify(profiles)); }
function saveAll() { saveLocal(); pushRemote(); }

/* ── CLOUD SYNC (Supabase) ── */
// Placeholders are replaced from repo secrets by .github/workflows/deploy.yml.
// Opened locally (placeholders intact), the app runs on localStorage only.
const SUPABASE_URL = '__SUPABASE_URL__'.replace(/\/+$/, '');
const SUPABASE_KEY = '__SUPABASE_ANON_KEY__';
const SYNC_KEY = '__SYNC_KEY__';
const CLOUD = /^https:\/\//.test(SUPABASE_URL) && !/^__/.test(SUPABASE_KEY) && !/^__/.test(SYNC_KEY);

async function rpc(fn, args) {
  const headers = { 'Content-Type': 'application/json', apikey: SUPABASE_KEY };
  // Legacy anon keys are JWTs and also go in Authorization; new sb_publishable_ keys must not.
  if (SUPABASE_KEY.startsWith('eyJ')) headers.Authorization = 'Bearer ' + SUPABASE_KEY;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST', headers, body: JSON.stringify(args), keepalive: true
  });
  if (!res.ok) throw new Error(`${fn}: ${res.status} ${await res.text()}`);
  return res.json();
}

const timeStr = () => new Date().toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});

function setStatus(text, kind = '') {
  ['sync-status', 'save-status'].forEach(id => {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = id + (kind ? ' ' + kind : '');
  });
}

let pushing = false, pushAgain = false;
async function pushRemote() {
  if (!CLOUD) { setStatus('✓ บันทึกแล้ว ' + timeStr(), 'ok'); return false; }
  if (pushing) { pushAgain = true; return false; }
  pushing = true;
  setStatus('☁️ กำลังซิงก์…');
  try {
    await rpc('save_expense_data', { p_key: SYNC_KEY, p_data: profiles });
    setStatus('☁️ ซิงก์แล้ว ' + timeStr(), 'ok');
    return true;
  } catch (e) {
    console.error(e);
    setStatus('⚠️ ซิงก์ไม่สำเร็จ — บันทึกไว้ในเครื่องแล้ว', 'err');
    return false;
  } finally {
    pushing = false;
    if (pushAgain) { pushAgain = false; pushRemote(); }
  }
}

function applyRemote(data) {
  profiles = data;
  saveLocal();
  setStatus('☁️ ซิงก์แล้ว ' + timeStr(), 'ok');
}

async function refreshFromCloud() {
  if (!CLOUD) return;
  setStatus('☁️ กำลังโหลด…');
  try {
    const remote = await rpc('get_expense_data', { p_key: SYNC_KEY });
    const base = Array.isArray(remote) ? remote : [];
    // First sync on this device: keep profiles that exist only here instead of overwriting them.
    const extra = localStorage.getItem(SYNCED_FLAG) ? [] : profiles.filter(p => !base.some(r => r.id === p.id));
    if (Array.isArray(remote)) applyRemote(base.concat(extra));
    const ok = (!Array.isArray(remote) || extra.length) ? await pushRemote() : true;
    if (ok) localStorage.setItem(SYNCED_FLAG, '1');
    if (document.getElementById('page-home').classList.contains('active')) renderHome();
  } catch (e) {
    console.error(e);
    setStatus('⚠️ โหลดจากคลาวด์ไม่สำเร็จ — ใช้ข้อมูลในเครื่อง', 'err');
  }
}

function renderSyncCard() {
  document.getElementById('sync-desc').textContent = CLOUD
    ? 'ข้อมูลซิงก์อัตโนมัติ — ทุกเครื่องเห็นชุดเดียวกัน'
    : 'ยังไม่ได้ตั้งค่า Supabase — ข้อมูลเก็บเฉพาะในเครื่องนี้';
}

/* ── AUTOSAVE ── */
let saveTimer = null;
function scheduleSave() {
  if (!currentId) return;
  clearTimeout(saveTimer);
  setStatus('⏳ รอบันทึก…');
  saveTimer = setTimeout(() => { saveTimer = null; saveProfile(true); }, AUTOSAVE_MS);
}
function flushSave() {
  if (!saveTimer) return;
  clearTimeout(saveTimer); saveTimer = null;
  saveProfile(true);
}

/* ── INPUT VALIDATION ── */
function sanitizeNum(input) {
  let v = input.value.replace(/[^0-9.]/g, '');
  const parts = v.split('.');
  if (parts.length > 2) v = parts[0] + '.' + parts.slice(1).join('');
  input.value = v;
}

function attachValidation(input) {
  input.addEventListener('keydown', e => {
    const allowed = ['Backspace','Delete','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Tab','Enter','Home','End'];
    if (allowed.includes(e.key)) return;
    if (e.key === '.' && !input.value.includes('.')) return;
    if (e.key >= '0' && e.key <= '9') return;
    e.preventDefault();
  });
  input.addEventListener('input', () => { sanitizeNum(input); calc(); });
  input.addEventListener('blur', () => {
    if (input.value === '' || input.value === '.') input.value = '0';
  });
}

function getVal(input) {
  const v = parseFloat(input.value);
  return isNaN(v) || v < 0 ? 0 : v;
}

/* ── ROW MANAGEMENT ── */
let rowCounter = 1000;

function makeRow(catId, label = '', value = '0') {
  const key = 'r_' + (rowCounter++);
  const row = document.createElement('div');
  row.className = 'dyn-row';
  row.dataset.catId = catId;
  row.dataset.key = key;
  row.innerHTML = `
    <div class="dyn-row-inner">
      <input class="dyn-label-input" type="text" value="${escHtml(label)}" placeholder="ชื่อรายการ...">
      <div class="row-input-wrap"><span>฿</span><input class="num-input" type="text" inputmode="decimal" value="${escHtml(value)}"></div>
    </div>
    <button class="btn-del-row" title="ลบรายการ" onclick="delRow(this)">✕</button>
  `;
  attachValidation(row.querySelector('.num-input'));
  row.querySelector('.dyn-label-input').addEventListener('input', calc);
  return row;
}

function addRow(catId) {
  const card = document.querySelector(`.expense-card[data-cat-id="${catId}"]`);
  if (!card) return;
  const row = makeRow(catId);
  card.appendChild(row);
  row.querySelector('.dyn-label-input').focus();
  calc(); scheduleSave();
}

function delRow(btn) {
  const row = btn.closest('.dyn-row');
  const card = row.closest('.expense-card');
  if (card.querySelectorAll('.dyn-row').length <= 1) {
    showToast('⚠️ ต้องมีอย่างน้อย 1 รายการ');
    return;
  }
  row.remove();
  calc(); scheduleSave();
}

/* ── CATEGORY MANAGEMENT ── */
let catCounter = 1;

function makeCategoryBlock(cat) {
  const block = document.createElement('div');
  block.className = 'category-block';
  block.dataset.catId = cat.id;

  const header = document.createElement('div');
  header.className = 'category-header';

  const nameInput = document.createElement('input');
  nameInput.type = 'text';
  nameInput.className = 'cat-name-input';
  nameInput.value = cat.name;
  nameInput.placeholder = 'ชื่อหมวดหมู่...';
  nameInput.title = 'คลิกเพื่อแก้ไขชื่อหมวดหมู่';
  nameInput.addEventListener('input', calc);

  const divider = document.createElement('div');
  divider.className = 'cat-divider';

  const delBtn = document.createElement('button');
  delBtn.className = 'btn-del-cat';
  delBtn.textContent = '🗑 ลบหมวดนี้';
  delBtn.onclick = () => deleteCategory(cat.id);

  header.appendChild(nameInput);
  header.appendChild(divider);
  header.appendChild(delBtn);

  const card = document.createElement('div');
  card.className = 'expense-card';
  card.dataset.catId = cat.id;

  (cat.rows || []).forEach(r => {
    card.appendChild(makeRow(cat.id, r.label, r.value));
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'btn-add-row';
  addBtn.innerHTML = '＋ เพิ่มรายการ';
  addBtn.onclick = () => addRow(cat.id);

  card.appendChild(addBtn);

  block.appendChild(header);
  block.appendChild(card);

  return block;
}

function deleteCategory(catId) {
  const blocks = document.querySelectorAll('.category-block');
  if (blocks.length <= 1) {
    showToast('⚠️ ต้องมีอย่างน้อย 1 หมวดหมู่');
    return;
  }
  const block = document.querySelector(`.category-block[data-cat-id="${catId}"]`);
  if (block && confirm('ลบหมวดหมู่นี้และรายการทั้งหมดในนั้น?')) {
    block.remove();
    calc(); scheduleSave();
  }
}

function addCategory(name) {
  const id = 'cat_' + (catCounter++) + '_' + Date.now();
  const cat = { id, name, rows: [{ key: 'r_init_' + Date.now(), label: '', value: '0' }] };
  const container = document.getElementById('categories-container');
  container.appendChild(makeCategoryBlock(cat));
  calc(); scheduleSave();
}

/* ── COLLECT DATA FROM DOM ── */
function collectCategories() {
  const cats = [];
  document.querySelectorAll('.category-block').forEach(block => {
    const catId = block.dataset.catId;
    const name = block.querySelector('.cat-name-input').value || 'ไม่มีชื่อ';
    const rows = [];
    block.querySelectorAll('.dyn-row').forEach(row => {
      rows.push({
        key: row.dataset.key,
        label: row.querySelector('.dyn-label-input').value,
        value: getVal(row.querySelector('.num-input'))
      });
    });
    cats.push({ id: catId, name, rows });
  });
  return cats;
}

/* ── CALC ── */
function calc() {
  const salary = getVal(document.getElementById('salary'));
  let totalExpenses = 0;
  const catSums = [];

  document.querySelectorAll('.category-block').forEach(block => {
    const catId = block.dataset.catId;
    const name = block.querySelector('.cat-name-input').value || 'ไม่มีชื่อ';
    const sum = Array.from(block.querySelectorAll('.num-input')).reduce((s, el) => s + getVal(el), 0);
    totalExpenses += sum;
    catSums.push({ catId, name, sum });
  });

  const remain = salary - totalExpenses;

  document.getElementById('s_salary').textContent = fmt(salary);

  // Rebuild summary cats
  const summCats = document.getElementById('summary-cats');
  summCats.innerHTML = '';
  catSums.forEach(c => {
    const row = document.createElement('div');
    row.className = 'summary-row';
    row.innerHTML = `<span class="label">${escHtml(c.name)}</span><span class="val deduct">${fmtNeg(c.sum)}</span>`;
    summCats.appendChild(row);
  });

  document.getElementById('s_remain').textContent = fmt(remain);
  document.getElementById('banner_amount').textContent = fmt(remain);

  const banner = document.getElementById('banner');
  const note = document.getElementById('banner_note');
  if (remain >= 0) {
    banner.className = 'result-banner positive';
    note.textContent = remain >= 10000 ? '🎉 ดีมาก! มีเงินเหลือเก็บเพิ่ม' : '👍 ยังมีเงินเหลือพอใช้';
  } else {
    banner.className = 'result-banner negative';
    note.textContent = '⚠️ ค่าใช้จ่ายเกินรายรับ!';
  }
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── RENDER PROFILE ── */
function renderProfile(p) {
  document.getElementById('profile-name').value = p.name || '';
  document.getElementById('detail-title').textContent = p.name || 'โปรไฟล์';
  document.getElementById('salary').value = p.salary ?? 0;

  const container = document.getElementById('categories-container');
  container.innerHTML = '';

  const cats = p.categories || defaultCategories();
  cats.forEach(cat => {
    container.appendChild(makeCategoryBlock(cat));
  });

  calc();
}

function defaultCategories() {
  return [
    {
      id: 'cat_fixed_' + Date.now(),
      name: 'หักก้อนใหญ่ (Fixed)',
      rows: [
        {key:'tax', label:'🏦 ภาษี ณ ที่จ่าย', value:0},
        {key:'social', label:'🛡️ ประกันสังคม', value:0},
        {key:'invest', label:'📈 ลงทุน', value:0},
        {key:'common', label:'🏢 ส่วนกลาง', value:0},
        {key:'health', label:'🏥 ประกันสุขภาพ', value:0},
        {key:'car_ins', label:'🚗 ประกันรถ', value:0},
        {key:'mortgage', label:'🏠 ผ่อนบ้าน', value:0},
      ]
    },
    {
      id: 'cat_monthly_' + (Date.now()+1),
      name: 'ค่าใช้จ่ายรายเดือน',
      rows: [
        {key:'shopee', label:'🛍️ ชอปปี้', value:0},
        {key:'fuel', label:'⛽ ค่าน้ำมัน+ด่วน', value:0},
        {key:'elec', label:'💡 ค่าไฟคอนโด', value:0},
        {key:'cowe', label:'🌊 โคเว', value:0},
        {key:'mobile', label:'📱 ค่ามือถือ+เน็ต (เราและแฟน)', value:0},
        {key:'yt', label:'▶️ YouTube Subscribe BG Channel', value:0},
        {key:'netflix', label:'🎬 Netflix', value:0},
        {key:'vitamin', label:'💊 วิตามิน', value:0},
        {key:'food_wd', label:'🍱 กินวันธรรมดา', value:0},
        {key:'food_clean', label:'🥗 อาหารคลีน', value:0},
      ]
    }
  ];
}

/* ── CALC REMAIN FOR HOME CARD ── */
function calcRemain(p) {
  return (p.categories || []).reduce((total, cat) => {
    return total - (cat.rows || []).reduce((s, r) => s + (parseFloat(r.value) || 0), 0);
  }, parseFloat(p.salary) || 0);
}

function renderHome() {
  const grid = document.getElementById('profile-grid');
  grid.innerHTML = '';
  profiles.forEach(p => {
    const remain = calcRemain(p);
    const card = document.createElement('div');
    card.className = 'profile-card';
    card.innerHTML = `
      <button class="p-delete" title="ลบ" data-id="${p.id}">✕</button>
      <div class="p-name">${escHtml(p.name || 'ไม่มีชื่อ')}</div>
      <div class="p-label">เงินคงเหลือสุทธิ</div>
      <div class="p-remain ${remain >= 0 ? 'pos' : 'neg'}">${fmt(remain)}</div>
    `;
    card.querySelector('.p-delete').addEventListener('click', e => { e.stopPropagation(); deleteProfile(p.id); });
    card.addEventListener('click', () => openProfile(p.id));
    grid.appendChild(card);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'btn-add';
  addBtn.innerHTML = '<span class="plus">+</span> เพิ่มโปรไฟล์ใหม่';
  addBtn.onclick = openModal;
  grid.appendChild(addBtn);
}

/* ── MODAL: Profile ── */
function openModal() {
  document.getElementById('modal-name').value = '';
  document.getElementById('modal').classList.add('open');
  setTimeout(() => document.getElementById('modal-name').focus(), 100);
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }
function confirmNew() {
  const name = document.getElementById('modal-name').value.trim();
  if (!name) { document.getElementById('modal-name').focus(); return; }
  const id = 'p_' + Date.now();
  const p = { id, name, salary: 0, categories: defaultCategories() };
  profiles.push(p);
  saveAll();
  closeModal();
  openProfile(id);
}
document.getElementById('modal-name').addEventListener('keydown', e => { if (e.key === 'Enter') confirmNew(); });

/* ── MODAL: Category ── */
function openCatModal() {
  document.getElementById('cat-modal-name').value = '';
  document.getElementById('cat-modal').classList.add('open');
  setTimeout(() => document.getElementById('cat-modal-name').focus(), 100);
}
function closeCatModal() { document.getElementById('cat-modal').classList.remove('open'); }
function confirmNewCat() {
  const name = document.getElementById('cat-modal-name').value.trim();
  if (!name) { document.getElementById('cat-modal-name').focus(); return; }
  closeCatModal();
  addCategory(name);
  showToast('✅ เพิ่มหมวดหมู่แล้ว');
}
document.getElementById('cat-modal-name').addEventListener('keydown', e => { if (e.key === 'Enter') confirmNewCat(); });

// Close modals on overlay click
document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.getElementById('cat-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeCatModal(); });

function deleteProfile(id) {
  if (!confirm('ลบโปรไฟล์นี้?')) return;
  profiles = profiles.filter(p => p.id !== id);
  saveAll(); renderHome();
}

/* ── OPEN / SAVE ── */
function openProfile(id) {
  currentId = id;
  const p = profiles.find(x => x.id === id);
  renderProfile(p);
  showPage('page-detail');
}

function onNameInput() {
  document.getElementById('detail-title').textContent = document.getElementById('profile-name').value || 'โปรไฟล์';
}

function saveProfile(silent = false) {
  clearTimeout(saveTimer); saveTimer = null;
  const p = profiles.find(x => x.id === currentId);
  if (!p) return;
  p.name = document.getElementById('profile-name').value.trim() || 'ไม่มีชื่อ';
  p.salary = getVal(document.getElementById('salary'));
  p.categories = collectCategories();
  saveAll(); renderHome();
  if (!silent) showToast('💾 บันทึกแล้ว');
}

function resetForm() {
  document.getElementById('salary').value = '0';
  document.querySelectorAll('.category-block .num-input').forEach(el => el.value = '0');
  calc(); scheduleSave();
}

// Any typing on the detail page (name, salary, labels, amounts, category names) triggers autosave.
document.getElementById('page-detail').addEventListener('input', scheduleSave);

/* ── NAV ── */
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}
function goHome() { flushSave(); showPage('page-home'); renderHome(); }

/* ── TOAST ── */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

/* ── BOOT ── */
// Save pending edits when the tab is hidden/closed; pull other devices' changes when it returns to home.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushSave();
  else if (document.getElementById('page-home').classList.contains('active') && !saveTimer) refreshFromCloud();
});
window.addEventListener('pagehide', flushSave);

attachValidation(document.getElementById('salary'));
renderSyncCard();
renderHome();
refreshFromCloud();
</script>
